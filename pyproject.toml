# 프로젝트 기본 메타데이터와 Python 버전을 정의한다.
[project]
name = "omok-rl"
version = "0.1.0"
description = "AlphaZero-style Gomoku self-play training and web play service."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.110.3",
    "uvicorn[standard]==0.29.0",
    "torch>=2.7,<3.0",
    "numpy==1.26.4",
    "orjson==3.10.0",
    "typer==0.12.3",
    "click==8.1.7",
]

# Windows/Linux에서는 CUDA 12.8 PyTorch wheel을 우선 사용한다.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

# PyTorch CUDA wheel 전용 인덱스라서 명시적으로 지정된 패키지만 조회한다.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
